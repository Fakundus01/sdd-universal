<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · SDD Hub</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 22h28M18 32h28M18 42h17' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{--bg:#f5f6fa;--card:#fff;--ink:#1a2233;--muted:#5b6478;--line:#e4e7ef;--accent:#4f46e5}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b0f1f;--card:#151b30;--ink:#eef1fb;--muted:#98a2c0;--line:#252d47;--accent:#a9a4ff}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;line-height:1.55}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 32px;
       max-width:520px;text-align:center;box-shadow:0 10px 30px rgba(16,24,40,.07)}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;font-weight:700;letter-spacing:.12em;
        color:var(--accent);text-transform:uppercase}
  h1{font-size:1.5rem;letter-spacing:-.02em;margin:10px 0 8px}
  p{color:var(--muted);font-size:.92rem}
  .links{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .links a{text-decoration:none;font-size:.86rem;font-weight:700;padding:9px 16px;border-radius:10px;
           background:var(--accent);color:#fff}
  .links a.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="box">
  <p class="code">Error 404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el archivo haya cambiado de nombre en una versión nueva del paquete, o que el link esté mal escrito. El catálogo sigue en su lugar.</p>
  <div class="links">
    <a href="/web/">Ir al catálogo</a>
    <a class="ghost" href="https://github.com/Fakundus01/sdd-universal">Ver el repo</a>
  </div>
</div>
</body>
</html>
