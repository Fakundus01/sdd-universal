<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservá tu turno — Peluquería Nadia</title>
<style>
  :root{--bg:#12121a;--card:#1b1b26;--ink:#f2f2f7;--muted:#9a9ab0;--line:#2c2c3a;
        --ac:#e0568a;--ac2:#ff7fae;--ok:#4ade80;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       line-height:1.5;padding:18px;font-size:14px}
  h1{font-size:1.15rem;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.8rem;margin:3px 0 16px}
  .campo{margin-bottom:14px}
  label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
        color:var(--muted);margin-bottom:6px}
  select,input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
       background:var(--card);color:var(--ink);font-size:.88rem;font-family:inherit}
  .dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .dia{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
       padding:7px 10px;cursor:pointer;font-family:inherit;text-align:center;min-width:52px}
  .dia small{display:block;font-size:.62rem;color:var(--muted);text-transform:uppercase}
  .dia b{font-size:.95rem}
  .dia.sel{background:var(--ac);border-color:var(--ac);color:#fff}
  .dia.sel small{color:#ffd9e7}
  .horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
  .hora{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;
        padding:8px 4px;cursor:pointer;font-family:inherit;font-size:.83rem}
  .hora.sel{background:var(--ac);border-color:var(--ac);color:#fff}
  .btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;
       font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;margin-top:4px}
  .btn:hover{background:var(--ac2)}
  .msg{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:.85rem;display:none}
  .msg.ok{display:block;background:#14321f;color:var(--ok);border:1px solid #1f5433}
  .agenda{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .agenda h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
  .agenda ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .agenda li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
       font-size:.8rem;display:flex;gap:9px;align-items:center}
  .agenda li code{font-family:var(--mono);color:var(--ac2);font-size:.78rem}
  .agenda li span{color:var(--muted);margin-left:auto;font-size:.74rem}
  .agenda .vacio{color:var(--muted);font-size:.8rem}
  .sim{margin-top:10px;width:100%;background:transparent;color:var(--muted);border:1px dashed var(--line);
       border-radius:9px;padding:8px;font-size:.76rem;cursor:pointer;font-family:inherit}
  .sim:hover{color:var(--ink)}
</style>
</head>
<body>

<h1>Reservá tu turno</h1>
<p class="sub">Peluquería Nadia · Villa Crespo</p>

<div class="campo">
  <label for="servicio">Servicio</label>
  <select id="servicio"></select>
</div>

<div class="campo">
  <label>Día</label>
  <div class="dias" id="dias"></div>
</div>

<div class="campo">
  <label>Horario</label>
  <div class="horas" id="horas"></div>
</div>

<div class="campo">
  <label for="nombre">Tu nombre</label>
  <input id="nombre" type="text" value="Ana Pérez">
</div>

<button class="btn" id="confirmar">Confirmar turno</button>
<div class="msg" id="msg"></div>

<button class="sim" id="simular">⟳ Simular: otra clienta reserva el horario que elegiste</button>

<div class="agenda">
  <h2>Agenda del día</h2>
  <ul id="agenda"></ul>
</div>

<script>
/* <<<CODIGO */
const SERVICIOS = [
  {id: 1, nombre: "Corte", duracion: 30},
  {id: 2, nombre: "Color", duracion: 90},
  {id: 3, nombre: "Peinado", duracion: 45}
];

let turnos = [];
let diaSel = 0, horaSel = null;

// Genera los horarios del día: de 9 a 19, cada media hora.
function horariosDisponibles() {
  const slots = [];
  for (let h = 9; h < 19; h++) {
    slots.push(`${String(h).padStart(2, "0")}:00`);
    slots.push(`${String(h).padStart(2, "0")}:30`);
  }
  return slots;
}

function reservar(fecha, hora, servicio, nombre) {
  turnos.push({fecha, hora, servicio: servicio.nombre, nombre});
  return {ok: true};
}
/* CODIGO>>> */

const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const $ = id => document.getElementById(id);
const proximosDias = () => Array.from({length: 14}, (_, i) => {
  const d = new Date(); d.setDate(d.getDate() + i); return d;
});

function pintar() {
  $("servicio").innerHTML = SERVICIOS.map(s =>
    `<option value="${s.id}">${s.nombre} (${s.duracion} min)</option>`).join("");

  $("dias").innerHTML = proximosDias().map((d, i) =>
    `<button class="dia${i === diaSel ? " sel" : ""}" data-d="${i}">
       <small>${DIAS[d.getDay()]}</small><b>${d.getDate()}</b></button>`).join("");

  $("horas").innerHTML = horariosDisponibles().map(h =>
    `<button class="hora${h === horaSel ? " sel" : ""}" data-h="${h}">${h}</button>`).join("");

  const f = proximosDias()[diaSel].toDateString();
  const delDia = turnos.filter(t => t.fecha === f);
  $("agenda").innerHTML = delDia.length
    ? delDia.sort((a, b) => a.hora.localeCompare(b.hora)).map(t =>
        `<li><code>${t.hora}</code> ${t.nombre} <span>${t.servicio}</span></li>`).join("")
    : `<li class="vacio">Sin turnos para este día.</li>`;
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-d]");
  if (d) { diaSel = +d.dataset.d; horaSel = null; $("msg").className = "msg"; pintar(); }
  const h = e.target.closest("[data-h]");
  if (h) { horaSel = h.dataset.h; pintar(); }
});

$("confirmar").onclick = () => {
  if (!horaSel) return;
  const serv = SERVICIOS.find(s => s.id === +$("servicio").value);
  const fecha = proximosDias()[diaSel].toDateString();
  reservar(fecha, horaSel, serv, $("nombre").value || "Sin nombre");
  const m = $("msg");
  m.className = "msg ok";
  m.textContent = `¡Listo! Te esperamos a las ${horaSel} para ${serv.nombre}.`;
  pintar();
};

$("simular").onclick = () => {
  if (!horaSel) { alert("Elegí primero un horario."); return; }
  const serv = SERVICIOS.find(s => s.id === +$("servicio").value);
  reservar(proximosDias()[diaSel].toDateString(), horaSel, serv, "Sofía G.");
  pintar();
};

pintar();
</script>
</body>
</html>
