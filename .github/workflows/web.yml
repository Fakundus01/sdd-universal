name: web

# Tests de la web sin navegador (D2 en sdd/status.md): el ZIP del proyecto
# y que la web muestre las mismas reglas que el master.
on:
  push:
    paths: ["web/**", "SDD-MASTER.md", "sdd-universal-tablero.html", "harness/**", "agents/**", "prompts/**", "playbooks/**", "skills/**", "*.md", ".github/workflows/web.yml"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test "web/tests/*.test.mjs"
